services:
  # 1) Public HTTPS backend (token + dispatch)
  - type: web
    name: square15-livekit-backend
    env: node
    rootDir: livekit-backend
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: TRUST_PROXY
        value: "1"
      # IMPORTANT: Set the following as "Secret" in Render dashboard after first deploy.
      # Render Blueprints don't allow marking secrets directly in yaml.
      - key: LIVEKIT_WS_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_AGENT_NAME
        value: square15-voice-assistant
      # Ozow payment credentials (set as Secret in Render dashboard)
      - key: OZOW_SITE_CODE
        sync: false
      - key: OZOW_API_KEY
        sync: false
      - key: OZOW_PRIVATE_KEY
        sync: false
      - key: OZOW_PAYOUT_API_KEY
        sync: false
      - key: OZOW_IS_TEST
        value: "false"
      - key: BACKEND_BASE_URL
        value: "https://square15-livekit-backend.onrender.com"
      # Admin bootstrap key for setting admin custom claims
      - key: ADMIN_BOOTSTRAP_KEY
        sync: false
      # Enable FCM push notifications for clients & artisans
      - key: ENABLE_FCM_PUSH
        value: "true"

  # 2) Always-on agent worker (receives dispatch jobs and speaks)
  - type: worker
    name: square15-agent-worker
    env: docker
    plan: starter
    rootDir: .
    dockerfilePath: agent-worker/Dockerfile
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_AGENT_NAME
        value: square15-voice-assistant
      - key: OPENAI_API_KEY
        sync: false

  # 3) WhatsApp Bot webhook server
  - type: web
    name: square15-whatsapp-bot
    env: node
    rootDir: whatsapp-bot
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
